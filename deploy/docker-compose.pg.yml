services:
  db:
    image: postgres:16-alpine
    container_name: wa-akg-pg-db
    environment:
      POSTGRES_PASSWORD: pgpass
      POSTGRES_DB: wa_akg
    ports: ["127.0.0.1:5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wa_akg"]
      interval: 5s
      retries: 10
  app:
    build: {context: ., dockerfile: Dockerfile}
    container_name: wa-akg-pg-app
    ports: ["3001:3000"]
    environment:
      - DATABASE_URL=postgresql://postgres:pgpass@db:5432/wa_akg
      - AUTH_SECRET=penareia-waakg-3f9c1d7b6a2e4850b1c7d9e2f4a6b8c0
      - BASE_URL=http://localhost:3001
      - NEXTAUTH_URL=http://localhost:3001
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - TZ=America/Sao_Paulo
      - LOCALE=pt-BR
      - DEFAULT_LANGUAGE=pt-BR
      - ADMIN_EMAIL=penareiaarena@gmail.com
      - ADMIN_PASSWORD=penareia2026
      - BAILEYS_LOG_LEVEL=error
    depends_on:
      db: {condition: service_healthy}
